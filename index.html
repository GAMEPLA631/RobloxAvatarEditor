<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Skin Studio Pro - Local DB Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .canvas-container { 
            position: relative; 
            background: #1e293b; 
            border-radius: 16px; 
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        #mainCanvas { cursor: crosshair; touch-action: none; image-rendering: pixelated; }

        .tool-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 12px; background: transparent; border: none; color: #94a3b8; }
        .tool-btn:hover { transform: translateY(-2px); background: rgba(59, 130, 246, 0.2); color: #f8fafc; }
        .active-tool { background: #3b82f6 !important; color: white !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .active-mode { background: linear-gradient(135deg, #3b82f6, #8b5cf6) !important; color: white !important; border: none !important; }

        #threeContainer { width: 100%; height: 400px; background: radial-gradient(circle at top, #1e293b 0%, #020617 100%); border-radius: 20px; }
        .scroll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 12px; max-height: 400px; overflow-y: auto; padding: 4px; }

        .item-card { cursor: pointer; transition: all 0.3s; background: rgba(51, 65, 85, 0.5); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05); position: relative; }
        .item-card:hover { border-color: #3b82f6; transform: scale(1.05); background: rgba(51, 65, 85, 0.8); }

        .locked-badge { position: absolute; top: 5px; right: 5px; background: #f59e0b; color: black; font-size: 8px; font-weight: 800; padding: 2px 4px; border-radius: 4px; }
        .tab-active { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border-bottom: 2px solid #3b82f6; border-radius: 0; }

        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #a855f7);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-input-field { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.4); color: white; padding: 8px 16px; border-radius: 12px; outline: none; transition: 0.3s; }
        .text-input-field:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }

        .view { transition: opacity 0.4s ease-in-out; }
        .hidden-view { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Main Editor View -->
        <div id="editorView" class="view">
            <header class="flex flex-col lg:flex-row justify-between items-center mb-10 gap-6">
                <div class="text-center lg:text-left">
                    <h1 class="text-4xl font-extrabold tracking-tight gradient-text mb-2">Skin Studio Pro</h1>
                    <p class="text-slate-400 font-medium">Moderný dizajnér s lokálnou IndexedDB databázou</p>
                </div>
                <div class="flex flex-wrap justify-center gap-4">
                    <button id="proBadge" onclick="showPricing()" class="bg-gradient-to-r from-amber-400 to-orange-500 text-black px-5 py-3 rounded-2xl font-bold flex items-center gap-2 hover:scale-105 transition-all shadow-lg">
                        <i data-lucide="crown"></i> Upgrade na PRO
                    </button>
                    <button onclick="fillBackground()" class="glass hover:bg-slate-700 px-5 py-3 rounded-2xl font-bold flex items-center gap-2 transition-all">
                        <i data-lucide="paint-bucket"></i> Vyfarbiť
                    </button>
                    <button onclick="downloadSkin()" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-2xl font-bold flex items-center gap-2 shadow-xl shadow-blue-900/20 transition-all active:scale-95">
                        <i data-lucide="download"></i> Export PNG
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                <!-- Editor Section -->
                <div class="lg:col-span-7 space-y-8">
                    <div class="glass p-5 rounded-3xl flex flex-wrap gap-5 items-center justify-between">
                        <div class="flex bg-slate-900/50 p-1.5 rounded-2xl">
                            <button id="brushTool" onclick="setTool('brush')" class="tool-btn active-tool p-3" title="Štetec"><i data-lucide="pencil"></i></button>
                            <button id="bucketTool" onclick="setTool('bucket')" class="tool-btn p-3" title="Plechovka"><i data-lucide="droplet"></i></button>
                            <button id="textTool" onclick="setTool('text')" class="tool-btn p-3" title="Pridať Text"><i data-lucide="type"></i></button>
                            <button id="eraserTool" onclick="setTool('eraser')" class="tool-btn p-3" title="Guma"><i data-lucide="eraser"></i></button>
                        </div>

                        <div id="textOptions" class="hidden flex items-center gap-2">
                            <input type="text" id="nameInput" placeholder="Zadaj meno..." class="text-input-field w-32 md:w-48 text-sm">
                        </div>
                        
                        <div class="flex items-center gap-4">
                            <div class="relative group">
                                <input type="color" id="colorPicker" value="#3b82f6" class="w-12 h-12 rounded-xl cursor-pointer bg-transparent border-none">
                            </div>
                            <input type="range" id="sizePicker" min="1" max="100" value="25" class="w-24 accent-blue-500">
                        </div>

                        <div class="flex gap-3">
                            <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 p-3 rounded-2xl transition-all shadow-lg">
                                <i data-lucide="upload"></i>
                                <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            </label>
                            <button onclick="clearCanvas()" class="bg-red-500/10 text-red-400 hover:bg-red-500/20 p-3 rounded-2xl">
                                <i data-lucide="refresh-cw"></i>
                            </button>
                        </div>
                    </div>

                    <div class="canvas-container p-6 flex justify-center">
                        <canvas id="mainCanvas" width="585" height="559" class="max-w-full rounded-lg"></canvas>
                    </div>
                </div>

                <!-- Right Panel: Preview & Assets -->
                <div class="lg:col-span-5 space-y-8">
                    <div class="glass p-1 rounded-3xl overflow-hidden shadow-2xl">
                        <div id="threeContainer"></div>
                    </div>

                    <div class="glass p-6 rounded-3xl">
                        <div class="flex gap-6 mb-6 border-b border-white/5 pb-2">
                            <button id="tabSkinsBtn" onclick="showTab('skins')" class="tab-btn tab-active font-bold">PRESETY</button>
                            <button id="tabHairBtn" onclick="showTab('hair')" class="tab-btn font-bold">VLASY</button>
                        </div>
                        <div id="skinLibraryTab" class="scroll-grid custom-scroll"></div>
                        <div id="hairLibraryTab" class="scroll-grid custom-scroll hidden"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pricing View -->
        <div id="pricingView" class="view hidden-view">
            <div class="max-w-4xl mx-auto py-12 px-4">
                <button onclick="showEditor()" class="text-slate-400 hover:text-white mb-8 flex items-center gap-2 transition">
                    <i data-lucide="arrow-left"></i> Späť do editora
                </button>
                <div class="text-center mb-16">
                    <h2 class="text-5xl font-extrabold mb-4 gradient-text">Vyber si svoj plán</h2>
                    <p class="text-slate-400 text-lg">Dáta o predplatnom ukladáme priamo do tvojho prehliadača.</p>
                </div>

                <div class="grid md:grid-cols-2 gap-8">
                    <div class="glass p-8 rounded-3xl flex flex-col">
                        <h3 class="text-2xl font-bold mb-2">Bezplatná verzia</h3>
                        <div class="text-4xl font-extrabold mb-10">0,00 €</div>
                        <button onclick="showEditor()" class="w-full py-4 rounded-2xl bg-slate-700 font-bold">Aktuálne používané</button>
                    </div>
                    <div class="glass p-8 rounded-3xl border-blue-500 relative flex flex-col">
                        <div class="absolute top-0 right-0 bg-blue-500 text-white text-[10px] font-black px-8 py-1 rotate-45 translate-x-6 translate-y-2">PRO</div>
                        <h3 class="text-2xl font-bold mb-2">PRO Verzia</h3>
                        <div class="text-4xl font-extrabold text-blue-400 mb-10">4,00 € <span class="text-sm font-normal text-slate-500">/ mesačne</span></div>
                        <button onclick="showPayment()" class="w-full py-4 rounded-2xl bg-blue-600 font-bold hover:bg-blue-500 shadow-lg shadow-blue-600/30">Odomknúť teraz</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Payment View -->
        <div id="paymentView" class="view hidden-view">
            <div class="max-w-md mx-auto py-20 px-4">
                <div class="glass p-8 rounded-3xl shadow-2xl">
                    <h3 class="text-xl font-bold mb-8">Zabezpečená platba</h3>
                    <form id="paymentForm" onsubmit="processPayment(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Číslo karty</label>
                            <input type="text" required placeholder="xxxx xxxx xxxx xxxx" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl outline-none focus:border-blue-500 transition">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" required placeholder="MM / RR" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl outline-none focus:border-blue-500 transition">
                            <input type="password" required placeholder="CVV" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl outline-none focus:border-blue-500 transition">
                        </div>
                        <button type="submit" id="payBtn" class="w-full bg-blue-600 py-4 rounded-2xl font-bold hover:bg-blue-500 transition shadow-lg mt-6">
                            <span id="payText">Zaplatiť 4,00 €</span>
                        </button>
                    </form>
                </div>
                <button onclick="showPricing()" class="w-full mt-6 text-slate-500 hover:text-white text-sm font-bold transition">Zrušiť platbu</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass px-8 py-4 rounded-2xl shadow-2xl translate-y-32 transition-all duration-500 flex items-center gap-4 z-50">
        <div class="bg-blue-500 p-2 rounded-lg"><i data-lucide="zap" class="w-4 h-4 text-white" id="toastIcon"></i></div>
        <span id="toastMsg" class="font-bold text-sm">Zmeny uložené do DB!</span>
    </div>

    <script>
        // --- INDEXED DB LOGIC ---
        const DB_NAME = 'SkinStudioDB';
        const STORE_NAME = 'subscription';
        let db;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        };

        const saveSubscription = (data) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            store.put({ id: 'current', ...data });
        };

        const getSubscription = () => {
            return new Promise((resolve) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get('current');
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => resolve(null);
            });
        };

        // --- CORE SETTINGS ---
        lucide.createIcons();
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const sizePicker = document.getElementById('sizePicker');
        const threeContainer = document.getElementById('threeContainer');
        const nameInput = document.getElementById('nameInput');
        
        let drawing = false;
        let tool = 'brush';
        let currentCharacter = 'female';
        let currentMode = 'full';
        let isPro = false;

        // Presety
        const skinPresets = [];
        for(let i=1; i<=60; i++) {
            skinPresets.push({
                name: i < 11 ? `Style ${i}` : `Pro Style ${i}`,
                primary: `hsl(${i * 15}, 60%, 15%)`,
                secondary: `hsl(${i * 15 + 40}, 80%, 60%)`,
                emoji: i < 11 ? "👕" : "💎",
                pro: i > 10
            });
        }

        // --- UI LOGIC ---
        const checkProStatus = async () => {
            const sub = await getSubscription();
            if (sub && sub.expiryDate) {
                const now = Date.now();
                if (now < sub.expiryDate) {
                    activateProUI();
                } else {
                    showToast("Predplatné vypršalo, prosím obnovte ho.", "alert-triangle");
                }
            }
            populateLibraries();
        };

        function activateProUI() {
            isPro = true;
            const badge = document.getElementById('proBadge');
            if (badge) {
                badge.innerHTML = '<i data-lucide="shield-check"></i> PRO VERZIA';
                badge.classList.remove('from-amber-400', 'to-orange-500');
                badge.classList.add('from-blue-500', 'to-indigo-600', 'text-white');
                badge.onclick = null;
            }
            populateLibraries();
            lucide.createIcons();
        }

        async function processPayment(e) {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            const payText = document.getElementById('payText');
            
            payText.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Spracovávam platbu...';
            btn.disabled = true;

            setTimeout(() => {
                const expiryDate = Date.now() + 30 * 24 * 60 * 60 * 1000; // 30 dní
                saveSubscription({ expiryDate, type: 'pro', paidAt: Date.now() });
                
                activateProUI();
                showToast("Platba úspešná! PRO aktivované v DB prehliadača.", "crown");
                showEditor();
                
                btn.disabled = false;
                payText.innerHTML = 'Zaplatiť 4,00 €';
            }, 2500);
        }

        // --- EDITOR LOGIC ---
        function initCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawTemplate();
        }

        function drawTemplate() {
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
            ctx.setLineDash([8, 4]);
            ctx.strokeRect(210, 100, 160, 200); // Trup
            ctx.strokeRect(50, 100, 150, 200);  // Ruky
            ctx.strokeRect(380, 100, 150, 200);
            ctx.strokeRect(100, 320, 180, 200); // Nohy
            ctx.strokeRect(300, 320, 180, 200);
            ctx.setLineDash([]);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (tool === 'text') {
                ctx.fillStyle = colorPicker.value;
                ctx.font = `bold ${sizePicker.value}px "Plus Jakarta Sans"`;
                ctx.textAlign = "center";
                ctx.fillText(nameInput.value || "AVATAR", x, y);
                updateTexture();
                return;
            }
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!drawing || tool === 'text') return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : colorPicker.value;
            ctx.lineTo(x, y);
            ctx.stroke();
            updateTexture();
        });

        canvas.addEventListener('mouseup', () => drawing = false);

        function fillBackground() {
            ctx.fillStyle = colorPicker.value;
            ctx.fillRect(210, 100, 160, 200);
            ctx.fillRect(50, 100, 150, 200);
            ctx.fillRect(380, 100, 150, 200);
            ctx.fillRect(100, 320, 180, 200);
            ctx.fillRect(300, 320, 180, 200);
            updateTexture();
        }

        function populateLibraries() {
            const skins = document.getElementById('skinLibraryTab');
            if (!skins) return;
            skins.innerHTML = '';
            skinPresets.forEach(p => {
                const d = document.createElement('div');
                d.className = 'item-card p-4 flex flex-col items-center gap-2';
                if (p.pro && !isPro) d.innerHTML += `<div class="locked-badge">PRO</div>`;
                d.innerHTML += `<div class="text-3xl">${p.emoji}</div><div class="text-[8px] font-bold text-slate-400 uppercase truncate text-center w-full">${p.name}</div>`;
                d.onclick = () => { if (p.pro && !isPro) showPricing(); else applyPreset(p); };
                skins.appendChild(d);
            });

            const hairs = document.getElementById('hairLibraryTab');
            if (!hairs) return;
            hairs.innerHTML = '';
            const hairIcons = ['👦','👱','👨','🦱','🎩'];
            for (let i = 1; i <= 90; i++) {
                const d = document.createElement('div');
                d.className = 'item-card p-4 flex flex-col items-center gap-2';
                d.innerHTML += `<div class="text-3xl">${hairIcons[i % 5]}</div><div class="text-[8px] text-slate-400">#${i}</div>`;
                hairs.appendChild(d);
            }
        }

        function applyPreset(p) {
            ctx.fillStyle = p.primary;
            ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = p.secondary;
            ctx.font = "80px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.emoji, 290, 220);
            updateTexture();
        }

        // --- THREE.JS ---
        let scene, camera, renderer, characterGroup, torsoMaterial, armsMaterial, legsMaterial;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, threeContainer.clientWidth / 400, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(threeContainer.clientWidth, 400);
            threeContainer.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            characterGroup = new THREE.Group();
            
            const mat = () => new THREE.MeshStandardMaterial({ color: 0xffffff });
            torsoMaterial = mat(); armsMaterial = mat(); legsMaterial = mat();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

            const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
            characterGroup.add(box(2, 2, 1, torsoMaterial));
            const head = box(1, 1, 1, skinMat); head.position.y = 1.6; characterGroup.add(head);
            const lArm = box(1, 2, 1, armsMaterial); lArm.position.set(-1.5, 0, 0); characterGroup.add(lArm);
            const rArm = box(1, 2, 1, armsMaterial); rArm.position.set(1.5, 0, 0); characterGroup.add(rArm);
            const lLeg = box(1, 2, 1, legsMaterial); lLeg.position.set(-0.5, -2, 0); characterGroup.add(lLeg);
            const rLeg = box(1, 2, 1, legsMaterial); rLeg.position.set(0.5, -2, 0); characterGroup.add(rLeg);

            scene.add(characterGroup);
            camera.position.z = 7;
            const anim = () => { requestAnimationFrame(anim); characterGroup.rotation.y += 0.008; renderer.render(scene, camera); };
            anim();
        }

        function updateTexture() {
            const tex = new THREE.CanvasTexture(canvas);
            [torsoMaterial, armsMaterial, legsMaterial].forEach(m => { m.map = tex; m.needsUpdate = true; });
        }

        // --- UTILS ---
        function setTool(t) { tool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool')); document.getElementById(t + 'Tool').classList.add('active-tool'); document.getElementById('textOptions').classList.toggle('hidden', t !== 'text'); }
        function showPricing() { document.getElementById('editorView').classList.add('hidden-view'); document.getElementById('pricingView').classList.remove('hidden-view'); }
        function showEditor() { document.getElementById('pricingView').classList.add('hidden-view'); document.getElementById('paymentView').classList.add('hidden-view'); document.getElementById('editorView').classList.remove('hidden-view'); }
        function showPayment() { document.getElementById('pricingView').classList.add('hidden-view'); document.getElementById('paymentView').classList.remove('hidden-view'); }
        function showTab(t) { document.getElementById('skinLibraryTab').classList.toggle('hidden', t !== 'skins'); document.getElementById('hairLibraryTab').classList.toggle('hidden', t !== 'hair'); document.getElementById('tabSkinsBtn').classList.toggle('tab-active', t === 'skins'); document.getElementById('tabHairBtn').classList.toggle('tab-active', t === 'hair'); }
        function showToast(msg, icon = "zap") { const toast = document.getElementById('toast'); document.getElementById('toastMsg').innerText = msg; toast.classList.remove('translate-y-32'); setTimeout(() => toast.classList.add('translate-y-32'), 3000); }
        function downloadSkin() { const l = document.createElement('a'); l.download = `roblox_skin.png`; l.href = canvas.toDataURL(); l.click(); }
        function clearCanvas() { initCanvas(); updateTexture(); }
        function handleImageUpload(e) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload=(ev)=>{const i=new Image(); i.onload=()=>{ctx.drawImage(i, 210, 100, 160, 200); updateTexture();}; i.src=ev.target.result;}; r.readAsDataURL(f); }

        window.onload = async () => {
            await initDB();
            initCanvas();
            init3D();
            await checkProStatus();
            updateTexture();
            lucide.createIcons();
        };
    </script>
</body>
</html>
